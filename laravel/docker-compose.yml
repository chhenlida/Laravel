version: '3.8'

services:
  app:
    image: php:8.0-fpm
    container_name: app
    volumes:
      - ./path/to/your/laravel/app:/var/www/html
    ports:
      - "8100:80"
    working_dir: /var/www/html
    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx_server
    volumes:
      - ./path/to/your/laravel/app:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8100:80"
    depends_on:
      - app
    networks:
      - app-network

  mysql:
    image: mysql:5.7
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel
    ports:
      - "3308:3306"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
